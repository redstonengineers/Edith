<!doctype html><meta charset=utf-8><style>body{margin:0;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:repeat(3,1fr)}
.c{padding:34px 20px;text-align:center}.d{background:#08070f;color:#eeeaf8}.l{background:#f6f4fc;color:#17122b}
img{width:132px;height:132px}.row{display:flex;gap:18px;justify-content:center;align-items:center;margin-top:20px}.row img{width:44px;height:44px}
.w{font-weight:700;letter-spacing:.32em;font-size:22px;margin-top:18px}p{font-size:12px;opacity:.7;margin:6px 0 0}h3{margin:0 0 14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}</style>
<script>for(const [n,f,t] of [['A · Visor','logo-a-visor.svg','E de tres barras con punto de enfoque'],['B · Hexágono','logo-b-hex.svg','Sello sólido, funciona en una sola tinta'],['C · Órbita','logo-c-orbit.svg','Anillo y núcleo: el asistente que vigila']])for(const k of ['d','l'])document.write(`<div class="c ${k}"><h3>${n}</h3><img src="${f}"><div class="w">EDITH</div><p>${t}</p><div class="row"><img src="${f}"><img src="${f}" style="width:28px;height:28px"><img src="${f}" style="width:16px;height:16px"></div></div>`)</script>
